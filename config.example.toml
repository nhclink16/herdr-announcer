# Announcer settings. Copy this file to the plugin config directory as
# config.toml — find that directory with:
#   herdr plugin config-dir nhclink16.announcer
# Every key is optional; defaults shown below.

# Which agent states trigger an announcement.
announce = ["done", "blocked"]

# Skip repeat announcements of the same pane+status inside this window.
debounce_seconds = 30

# Summary mode:
#   "codex"    - one-sentence LLM summary of what the agent did (via codex exec)
#   "command"  - same, but through any CLI you provide (see summary_command)
#   "template" - instant fixed phrasing ("builder finished in billing-api"), no LLM
# Codex mode falls back to template phrasing if the tool fails. Command mode
# can fall back either to template phrasing or to Codex first.
summary = "codex"
summary_fallback = "template" # "template" or "codex"
# Fall through quickly when a provider produces no model reasoning/output.
# This is separate from the longer overall completion timeouts below.
summary_first_activity_timeout_seconds = 5
codex_model = "gpt-5.6-luna"
codex_effort = "low"
codex_timeout_seconds = 45

# Prompt style for codex mode:
#   "announcement" - radio-voice, leads with the agent name ("Builder finished...")
#   "summary"      - plain factual report of what the agent did
#   "custom"       - your own prompt below; {agent}, {workspace}, {status} are
#                    substituted and the transcript is appended after it
style = "announcement"
# custom_prompt = "Tell me in one dramatic sentence what {agent} just did:"

# For summary = "command": any CLI that reads the transcript on stdin and
# prints one sentence. {agent}, {workspace}, and {status} are substituted.
# The bundled ACP client honors both the shared first-activity timeout and this
# overall command timeout. Other custom commands only receive the overall cap.
summary_command_timeout_seconds = 60
# Claude over ACP (the protocol T3 Code and Conductor use) — bundled example
# client, pinned to Sonnet 5, relative path resolves from the plugin directory:
# summary_command = ["python3", "examples/acp-summary.py", "One spoken sentence, maximum 25 words, plain words only, no markdown or file paths, leading with the agent name {agent} which just changed to {status} in workspace {workspace}: summarize the agent terminal output below for a voice announcement. Reply with only the sentence."]

# Fast Sonnet 5 -> Codex Terra -> fixed-template fallback chain:
# summary = "command"
# summary_fallback = "codex"
# summary_first_activity_timeout_seconds = 5
# summary_command_timeout_seconds = 30
# codex_model = "gpt-5.6-terra"
# codex_effort = "low"
# codex_timeout_seconds = 45
# summary_command = ["python3", "examples/acp-summary.py", "One spoken sentence, maximum 25 words, plain words only, no markdown or file paths, leading with the agent name {agent} which just changed to {status} in workspace {workspace}: summarize the agent terminal output below for a voice announcement. Reply with only the sentence."]

# No Codex? Claude Code works out of the box:
# summary_command = ["claude", "-p", "--model", "haiku", "One spoken sentence, maximum 25 words, plain words only, no markdown or file paths, leading with the agent name {agent} which just changed to {status} in workspace {workspace}: summarize the agent terminal output on stdin for a voice announcement. Reply with only the sentence."]

# Also show the summary as a Herdr toast notification. Toasts follow your
# [ui.toast] delivery setting — with delivery = "terminal" they reach you even
# over SSH, which makes this the "it just works remotely" option (visible, not
# audible; audio over SSH needs a speak_command route, see below).
toast = false

# ---- Voice backend: first configured one wins ----

# 1. Custom command (argv array). "{text}" is replaced with the announcement;
#    if no argument contains {text}, the text is piped to stdin instead.
#    Use this to route audio somewhere you can hear it when SSHed in, e.g.
#    text-to-speech on another tailnet machine, or an ntfy push:
# speak_command = ["ssh", "my-windows-box", "powershell", "-NoProfile", "-Command", "Add-Type -AssemblyName System.Speech; (New-Object System.Speech.Synthesis.SpeechSynthesizer).Speak('{text}')"]
# speak_command = ["curl", "-s", "-d", "{text}", "ntfy.sh/my-agent-announcements"]

# 2. ElevenLabs — set an API key to enable. Audio plays on this machine.
# elevenlabs_api_key = ""
# elevenlabs_voice_id = "21m00Tcm4TlvDq8ikWAM"
# elevenlabs_model = "eleven_turbo_v2_5"

# 3. Local TTS (default): `say` on macOS, spd-say/espeak on Linux.
#    Audio plays on the machine running the Herdr server.
# voice = "Samantha"
